name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/website-creation-capabilities-caw1ks
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site files
        run: |
          mkdir -p dist
          cp index.html diagnostika.html 5-chyb.html dist/
          cp -r assets dist/

      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create miriam-czompoly-trnava --production-branch=main

      - name: Deploy site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=miriam-czompoly-trnava
            --branch=main
            --commit-dirty=true
